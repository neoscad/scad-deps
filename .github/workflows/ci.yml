# Every pull request and push to main: formatting, clippy with and without
# the `cli` feature, the packaged crate builds alone, the tests pass on
# Linux, macOS and Windows (Windows exercises the junction/copy fallback
# in src/link.rs, which the others cannot), and the crate still builds on
# its declared minimum Rust version.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features cli -- -D warnings
      - run: cargo doc --locked --no-deps --features cli
        env:
          RUSTDOCFLAGS: -D warnings
      # What crates.io would receive builds on its own, with default features.
      - run: cargo package --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --no-fail-fast --features cli

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --locked --all-targets --features cli
